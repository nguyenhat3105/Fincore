spring:
  application:
    name: fincore
  profiles:
    default: local

server:
  port: ${FINCORE_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: ${spring.application.name}
    version: 0.1.0

